[package]
name = "balthasar-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "balthasar's vectors: a ranking signal, never the floor"

[features]
# Off by default, and that is the point. The default build has two dependencies and produces a
# 7 MB static binary; this one pulls a tensor library and needs 127 MB of weights on disk. A
# person who wants dense vectors opts in and knows what it cost them.
default = []
dense = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:serde_json"]

[dependencies]
balthasar-model.workspace = true
thiserror.workspace = true

candle-core = { version = "0.9", optional = true, default-features = false }
candle-nn = { version = "0.9", optional = true, default-features = false }
candle-transformers = { version = "0.9", optional = true, default-features = false }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
