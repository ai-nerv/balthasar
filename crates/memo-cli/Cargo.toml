[package]
name = "memo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "memo's command line"

[features]
# Forwarded so `cargo build --features dense` reaches the embedder. Off by default: the shipped
# binary is 7 MB and needs no weights, and that is the build almost everybody wants.
default = []
dense = ["memo-embed/dense"]

[dependencies]
memo-model.workspace = true
memo-recall.workspace = true
memo-distil.workspace = true
memo-embed.workspace = true
memo-host.workspace = true
memo-ipc.workspace = true
memo-lua.workspace = true
memo-store.workspace = true
memo-testkit.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true

[lints]
workspace = true
