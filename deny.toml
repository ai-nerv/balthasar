# The dependency policy `cargo deny check` holds the lockfile to, in `make verify` and in CI.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; candle 0.9's gemm 0.19 and pulp 0.22 need it, only under the dense feature, and no release of either drops it" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/onix-os/luna"]
