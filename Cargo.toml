[workspace]
members = [
  "crates/balthasar-model",
  "crates/balthasar-store",
  "crates/balthasar-lua",
  "crates/balthasar-distil",
  "crates/balthasar-recall",
  "crates/balthasar-embed",
  "crates/balthasar-ipc",
  "crates/balthasar-host",
  "crates/balthasar-buffer",
  "crates/balthasar-testkit",
  "crates/balthasar-cli",
  "crates/balthasar",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
# A dependency nothing uses is a lie about the graph — an edge that exists in `Cargo.toml`, in
# the lockfile and in every diagram somebody draws from them, and nowhere in the code. Nine of
# them were declared across this family.
#
# Enforced by `cargo machete` in `verify`, not by `unused_crate_dependencies`. That lint finds
# the same thing and then finds a great deal more: it runs per *target*, so every integration
# test is reported for every dev-dependency that one file happens not to name — twenty-odd
# warnings here, none of them a lie, and `clippy -Dwarnings` fails on all of them. machete reads
# the manifest against the whole package and has no such blind spot.
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
balthasar-model = { path = "crates/balthasar-model" }
balthasar-store = { path = "crates/balthasar-store" }
balthasar-cli = { path = "crates/balthasar-cli" }
balthasar-lua = { path = "crates/balthasar-lua" }
balthasar-distil = { path = "crates/balthasar-distil" }
balthasar-recall = { path = "crates/balthasar-recall" }
balthasar-embed = { path = "crates/balthasar-embed" }
balthasar-ipc = { path = "crates/balthasar-ipc" }
balthasar-host = { path = "crates/balthasar-host" }
balthasar-buffer = { path = "crates/balthasar-buffer" }
balthasar-testkit = { path = "crates/balthasar-testkit" }

anyhow = "1.0"
luna = { git = "https://github.com/onix-os/luna", tag = "v0.5.0" }
clap = { version = "4.5", features = ["derive", "std", "help", "usage", "error-context"], default-features = false }
rustix = { version = "1", features = ["net", "process"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"

# Asserted rather than left to defaults, as the family pins its release profile: a build that
# silently switches to fat LTO and one codegen unit turns a ten-second link into minutes.
[profile.release]
codegen-units = 16
lto = "thin"
strip = "symbols"
