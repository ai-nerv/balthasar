[workspace]
members = [
  "crates/aeon-model",
  "crates/aeon-store",
  "crates/aeon-lua",
  "crates/aeon-distil",
  "crates/aeon-recall",
  "crates/aeon-embed",
  "crates/aeon-ipc",
  "crates/aeon-host",
  "crates/aeon-buffer",
  "crates/aeon-testkit",
  "crates/aeon-cli",
  "crates/aeon",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
aeon-model = { path = "crates/aeon-model" }
aeon-store = { path = "crates/aeon-store" }
aeon-cli = { path = "crates/aeon-cli" }
aeon-lua = { path = "crates/aeon-lua" }
aeon-distil = { path = "crates/aeon-distil" }
aeon-recall = { path = "crates/aeon-recall" }
aeon-embed = { path = "crates/aeon-embed" }
aeon-ipc = { path = "crates/aeon-ipc" }
aeon-host = { path = "crates/aeon-host" }
aeon-buffer = { path = "crates/aeon-buffer" }
aeon-testkit = { path = "crates/aeon-testkit" }

anyhow = "1.0"
luna = { git = "https://github.com/onix-os/luna", tag = "v0.5.0" }
clap = { version = "4.5", features = ["derive", "std", "help", "usage", "error-context"], default-features = false }
rustix = { version = "1", features = ["net", "process"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"

# Asserted rather than left to defaults, as the family pins its release profile: a build that
# silently switches to fat LTO and one codegen unit turns a ten-second link into minutes.
[profile.release]
codegen-units = 16
lto = "thin"
strip = "symbols"
